<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartQueue | Live Dashboard</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    .live-dot {
      color: #00ff88;
      font-weight: 700;
      font-size: 14px;
    }

    .dashboard-header {
      text-align: center;
      margin: 20px 0;
    }

    .dashboard-header h2 {
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="brand">
      <span>📊 SmartQueue</span>
      <span class="brand-badge">LIVE</span>
    </div>

    <div class="nav-links">
      <a href="index.html">Book & Track</a>
      <a href="admin.html">Counter Panel</a>
      <a href="dashboard.html" class="active">Dashboard</a>
    </div>

  </nav>

  <!-- HEADER -->
  <header class="dashboard-header">
    <h2>📊 Real-Time Analytics Dashboard</h2>
    <p style="color:gray;">Live system monitoring</p>
    <div class="live-dot">● LIVE SYSTEM RUNNING</div>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- METRICS -->
    <section class="grid-4">

      <div class="metric-box">
        <div class="metric-value" id="metricTotal">0</div>
        <div class="metric-label">Total Tokens</div>
      </div>

      <div class="metric-box">
        <div class="metric-value" id="metricServed" style="color:#10b981;">0</div>
        <div class="metric-label">Served</div>
      </div>

      <div class="metric-box">
        <div class="metric-value" id="metricWaiting" style="color:#f59e0b;">0</div>
        <div class="metric-label">Waiting</div>
      </div>

      <div class="metric-box">
        <div class="metric-value" id="metricAvgWait" style="color:#06b6d4;">0 m</div>
        <div class="metric-label">Avg Wait Time</div>
      </div>

    </section>

    <!-- DEPARTMENT LIVE STATUS -->
    <section class="glass-card" style="margin-top:20px;">

      <h2>🏢 Department Live Status</h2>
      <p style="color:gray;">Real-time queue tracking across all departments</p>

      <div class="grid-2" id="departmentGrid">
        <!-- JS injects cards here -->
      </div>

    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
