<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartQueue | Book & Track</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <div class="brand">
      <span>⏱ SmartQueue</span>
      <span class="brand-badge">USER PORTAL</span>
    </div>

    <div class="nav-links">
      <a href="index.html" class="active">Book & Track</a>
      <a href="admin.html">Counter Panel</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <!-- ================= PAGE HEADER ================= -->
  <header class="page-header">
    <h1>Book & Track Token</h1>
    <p>Real-time queue management system</p>
  </header>

  <!-- ================= MAIN CONTAINER ================= -->
  <main class="container">

    <div class="grid-2">

      <!-- ================= BOOKING CARD ================= -->
      <section class="glass-card">
        <h2>🎟 Book Token</h2>

        <form id="bookingForm">

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="userName" placeholder="Enter your name" required />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="userPhone" placeholder="Enter phone number" required />
          </div>

          <div class="form-group">
            <label>Department</label>
            <select id="departmentSelect" required>
              <option value="">Select Department</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">
            Generate Token
          </button>

        </form>
      </section>

      <!-- ================= TRACKING CARD ================= -->
      <section class="glass-card">
        <h2>📍 Live Tracking</h2>

        <!-- EMPTY STATE -->
        <div id="noTicketState" class="empty-state">
          <div class="icon">🎫</div>
          <p>Book a token or enter token ID</p>

          <div class="track-box">
            <input type="text" id="trackInput" placeholder="Enter Token (GEN-101)">
            <button id="trackBtn" class="btn btn-primary">Track</button>
          </div>
        </div>

        <!-- ACTIVE STATE -->
        <div id="activeTicketState" style="display:none;">

          <div class="ticket-card">

            <h3 id="ticketDept">Department</h3>

            <div class="ticket-number" id="ticketNumber">---</div>

            <p id="ticketHolderName">---</p>

            <span id="ticketStatus" class="status-tag">WAITING</span>

            <div class="ticket-meta">
              <span>⏱ Wait: <b id="waitMins">0</b> mins</span>
              <span>👥 Ahead: <b id="aheadCount">0</b></span>
            </div>

          </div>

          <div class="ticket-info">
            <p>📍 Position: <span id="ticketPosition">-</span></p>
            <p>🖥 Counter: <span id="ticketCounter">Not assigned</span></p>
          </div>

        </div>

      </section>

    </div>

  </main>

  <!-- ================= SCRIPTS ================= -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>

  <div id="debug" style="display:none"></div>
</body>

</html>
